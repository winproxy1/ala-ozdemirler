<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kat Planı 3D</title>
<style>
  :root { --bg:#e8eaed; --ink:#1d2126; --panel:rgba(255,255,255,.86); --line:rgba(0,0,0,.1); --accent:#1f6f5c; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink);
    font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #title { position:fixed; left:16px; top:14px; padding:10px 14px; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); max-width:calc(100vw - 32px); }
  #title b { display:block; font-size:15px; letter-spacing:.01em; }
  #title span { font-size:12px; opacity:.7; }
  #bar { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); display:flex; flex-wrap:wrap; gap:6px;
    justify-content:center; padding:8px; background:var(--panel); border:1px solid var(--line); border-radius:14px;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); max-width:calc(100vw - 20px); }
  #bar button, #bar select { font:inherit; font-size:13px; color:var(--ink); background:#fff; border:1px solid var(--line);
    border-radius:9px; padding:7px 11px; cursor:pointer; }
  #bar button:hover, #bar select:hover { border-color:rgba(0,0,0,.3); }
  #bar button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  #bar .sep { width:1px; background:var(--line); margin:2px 3px; }
  .lbl { position:fixed; left:0; top:0; transform:translate(-50%,-50%); pointer-events:none; white-space:nowrap; text-align:center;
    padding:3px 8px; border-radius:7px; background:rgba(20,24,28,.72); color:#fff; font-size:11.5px; line-height:1.25; }
  .lbl i { font-style:normal; opacity:.75; font-size:10.5px; display:block; }
  #msg { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px;
    font-size:15px; background:var(--bg); z-index:5; }
  #hint { position:fixed; right:16px; top:14px; font-size:11.5px; opacity:.6; text-align:right; }
  @media (max-width:640px){ #hint{display:none} }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="title"><b>Kat Planı — 3D Görselleştirme</b><span>2 daire (2+1) · plana birebir · göz hizası iç mekân + üstten kontrol</span></div>
<div id="hint">Sürükle: döndür · Sağ tık / iki parmak: kaydır · Tekerlek: yakınlaş</div>
<div id="bar">
  <button data-v="persp">Perspektif</button>
  <button data-v="top">Üstten</button>
  <button data-v="d1">Daire 1</button>
  <button data-v="d2">Daire 2</button>
  <select id="inside"><option value="">İç mekân…</option></select>
  <div class="sep"></div>
  <button id="tPlan">Planı çakıştır</button>
  <button id="tLbl">Oda isimleri</button>
  <select id="wh" title="Duvar yüksekliği"><option value="280">Duvar: tam (2,80 m)</option><option value="200">Duvar: 2,00 m</option><option value="140">Duvar: 1,40 m</option><option value="100">Duvar: 1,00 m</option></select>
  <button id="png" title="Bu görünümü yüksek çözünürlüklü PNG olarak kaydet">PNG kaydet</button>
  <button id="glb" title="Modeli Blender / Lumion / Twinmotion için dışa aktar">GLB indir</button>
</div>
<div id="labels"></div>
<div id="msg">3D model yükleniyor…</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

const msg = document.getElementById('msg');
window.addEventListener('error', e => { msg.style.display = 'flex'; msg.textContent = 'Hata: ' + e.message; });

// ---------------------------------------------------------------- scale
// Plan image pixels -> metres. 59.7 px/m reproduces the room areas printed on the plan.
const S = 1 / 59.7, CX = 555, CY = 672, BG = 0xe8eaed;
// wall height: full storey by default; a lower cut (e.g. #h140 = 1.40 m) gives the open "3D plan" look for top views
let hSel = 280; try { const m = /^#h(\d{3})$/.exec(location.hash); hSel = m ? +m[1] : +(localStorage.getItem('wallH') || 280); } catch (e) {}
const H = Math.min(2.8, Math.max(1.0, (hSel || 280) / 100)), LOW = H < 2.75;
const X = px => (px - CX) * S, Z = py => (py - CY) * S;

// ---------------------------------------------------------------- renderer
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
const PR = Math.min(window.devicePixelRatio || 1, 1.75);
renderer.setPixelRatio(PR);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
const maxAniso = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;

const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 500);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.55; controls.minDistance = 0.3; controls.maxDistance = 500;

const hemi = new THREE.HemisphereLight(0xffffff, 0xcfc6b8, 1.0); scene.add(hemi);
renderer.shadowMap.autoUpdate = false;
const sun = new THREE.DirectionalLight(0xfff0dc, 2.7);
sun.position.set(11, 26, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -15, right: 15, top: 15, bottom: -15, near: 1, far: 95 });
sun.shadow.bias = -0.0002; sun.shadow.normalBias = 0.025; sun.shadow.radius = 4;
scene.add(sun);
// one shadow-casting ceiling light that follows the room being viewed (interior mode only)
const roomLight = new THREE.PointLight(0xfff0dd, 0, 10, 1.7);
roomLight.castShadow = true; roomLight.shadow.mapSize.set(1024, 1024); roomLight.shadow.bias = -0.003; roomLight.shadow.normalBias = 0.03;
roomLight.shadow.radius = 4; roomLight.shadow.camera.near = .05; roomLight.shadow.camera.far = 10; scene.add(roomLight);

// ---------------------------------------------------------------- procedural textures
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const shade = (hex, v) => { const n = parseInt(hex.slice(1), 16); const c = k => Math.max(0, Math.min(255, ((n >> k) & 255) + v));
  return `rgb(${c(16)|0},${c(8)|0},${c(0)|0})`; };
function ctex(w, h, draw, rep) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = maxAniso; if (rep) t.repeat.set(rep[0], rep[1]); return t;
}
const speckle = (g, w, h, r, n, a) => { for (let k = 0; k < n; k++) { const v = r() < .5 ? 0 : 255;
  g.fillStyle = `rgba(${v},${v},${v},${a * r()})`; g.fillRect(r() * w, r() * h, 1 + r() * 2, 1 + r() * 2); } };

// oak laminate: canvas = 2.56 m x 1.6 m, planks 1.28 m x 0.20 m
const tWood = ctex(1024, 1024, (g, w, h) => {
  const r = rng(7), rows = 8, rh = h / rows, pl = 512, tones = ['#c8a57a', '#c19c70', '#cdac83', '#bb966a', '#c5a177', '#d0b189'];
  for (let i = 0; i < rows; i++) {
    let x = -r() * pl;
    while (x < w) {
      g.save(); g.beginPath(); g.rect(x, i * rh, pl, rh); g.clip();
      g.fillStyle = tones[(r() * tones.length) | 0]; g.fillRect(x, i * rh, pl, rh);
      for (let k = 0; k < 30; k++) {
        const yy = i * rh + r() * rh;
        g.strokeStyle = `rgba(${r() < .6 ? '95,62,30' : '255,238,205'},${0.04 + r() * 0.08})`; g.lineWidth = 0.6 + r() * 1.4;
        g.beginPath(); g.moveTo(x, yy);
        g.bezierCurveTo(x + pl * .3, yy + (r() - .5) * 7, x + pl * .65, yy + (r() - .5) * 7, x + pl, yy + (r() - .5) * 5); g.stroke();
      }
      g.restore();
      g.fillStyle = 'rgba(55,36,18,.5)'; g.fillRect(x, i * rh, 1.5, rh); x += pl;
    }
    g.fillStyle = 'rgba(55,36,18,.45)'; g.fillRect(0, i * rh, w, 1.5);
  }
}, [1 / 2.56, 1 / 1.6]);

// square floor tiles (n x n tiles per canvas)
function tileTex(n, base, grout, gw, seed, world, vary) {
  return ctex(512, 512, (g, w) => {
    const r = rng(seed), s = w / n; g.fillStyle = grout; g.fillRect(0, 0, w, w);
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      g.fillStyle = shade(base, (r() - .5) * vary); g.fillRect(i * s + gw / 2, j * s + gw / 2, s - gw, s - gw); }
    speckle(g, w, w, r, 5000, .05);
  }, [1 / world, 1 / world]);
}
const tTile = tileTex(2, '#d9d5cd', '#a9a59d', 4, 3, 0.66, 8);       // antre porcelain, 33 cm grid as drawn
const tTileBath = tileTex(2, '#c9cdd0', '#8f9496', 4, 5, 0.66, 9);   // bathroom floor
const tTileOut = tileTex(2, '#b9b2a6', '#857f75', 5, 9, 0.66, 12);   // balcony
const tGranite = tileTex(1, '#cfcac2', '#9a958d', 3, 11, 0.6, 0);
// wall tile 60x30 cm, canvas = 1.2 m x 1.2 m
const tWallTile = ctex(512, 512, (g, w) => { const r = rng(21); g.fillStyle = '#c9cccd'; g.fillRect(0, 0, w, w);
  for (let i = 0; i < 2; i++) for (let j = 0; j < 4; j++) { g.fillStyle = shade('#f1f1ee', (r() - .5) * 4);
    g.fillRect(i * 256 + 1.5, j * 128 + 1.5, 253, 125); } });
// kitchen backsplash, small brick-bond tiles, canvas = 0.6 m
const tSplash = ctex(512, 512, (g, w) => { const r = rng(31); g.fillStyle = '#bfc2c2'; g.fillRect(0, 0, w, w);
  for (let j = 0; j < 8; j++) for (let i = -1; i < 4; i++) { g.fillStyle = shade('#f4f3ef', (r() - .5) * 6);
    g.fillRect(i * 128 + (j % 2) * 64 + 1.5, j * 64 + 1.5, 125, 61); } });
const tMarble = ctex(512, 512, (g, w) => { const r = rng(41); g.fillStyle = '#f1efec'; g.fillRect(0, 0, w, w);
  for (let k = 0; k < 14; k++) { g.strokeStyle = `rgba(120,118,115,${.05 + r() * .12})`; g.lineWidth = .6 + r() * 2;
    g.beginPath(); let x = r() * w, y = r() * w; g.moveTo(x, y);
    for (let s = 0; s < 5; s++) { x += (r() - .3) * 160; y += (r() - .5) * 120; g.lineTo(x, y); } g.stroke(); }
  speckle(g, w, w, r, 2500, .04); });
const tGrain = ctex(512, 512, (g, w) => { const r = rng(51); g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, w);
  for (let k = 0; k < 150; k++) { const y = r() * w; g.strokeStyle = `rgba(70,45,25,${.04 + r() * .1})`; g.lineWidth = .5 + r() * 1.6;
    g.beginPath(); g.moveTo(0, y); g.bezierCurveTo(w * .3, y + (r() - .5) * 14, w * .7, y + (r() - .5) * 14, w, y + (r() - .5) * 8); g.stroke(); } });
const tFabric = ctex(256, 256, (g, w) => { const r = rng(61); g.fillStyle = '#f4f4f4'; g.fillRect(0, 0, w, w);
  for (let y = 0; y < w; y += 2) for (let x = 0; x < w; x += 2) { const v = 225 + ((r() * 30) | 0); g.fillStyle = `rgb(${v},${v},${v})`;

  const to = { p: v3(...v.p), t: v3(...v.t), fov: v.fov };
  if (instant) { camera.position.copy(to.p); controls.target.copy(to.t); camera.fov = to.fov; camera.updateProjectionMatrix(); controls.update(); return; }
  tween = { t0: performance.now(), dur: 1100, from: { p: camera.position.clone(), t: controls.target.clone(), fov: camera.fov }, to };
  controls.enabled = false;
}
document.querySelectorAll('#bar button[data-v]').forEach(b => b.addEventListener('click', () => go(b.dataset.v)));
sel.addEventListener('change', () => sel.value && go(sel.value));
document.getElementById('tPlan').addEventListener('click', e => { if (!overlay) return; overlay.visible = !overlay.visible;
  e.currentTarget.classList.toggle('on', overlay.visible); if (overlay.visible) go('top'); });
document.getElementById('glb').addEventListener('click', () => {   // export the exact geometry for Blender / Lumion / Twinmotion / SketchUp
  const hid = [ground, sky, overlay, fixtures].filter(Boolean).map(o => [o, o.visible]); hid.forEach(h => h[0].visible = false);
  const up = uppers.map(u => u.visible); uppers.forEach(u => u.visible = true);
  new GLTFExporter().parse(scene, buf => { hid.forEach(h => h[0].visible = h[1]); uppers.forEach((u, i) => u.visible = up[i]);
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([buf], { type: 'model/gltf-binary' })); a.download = 'kat-plani-3d.glb'; a.click();
  }, e => alert('Dışa aktarma hatası: ' + e), { binary: true, onlyVisible: true });
});
document.getElementById('tLbl').addEventListener('click', e => { showLabels = !showLabels; e.currentTarget.classList.toggle('on', showLabels); });

function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  if (composer) { composer.setPixelRatio(PR); composer.setSize(w, h); }
}
addEventListener('resize', resize); resize(); sel.hidden = LOW; go(LOW ? 'top' : 'in0', true);
window.__go = go; window.__scene = { scene, camera, controls, renderer };

function frame(now) {
  requestAnimationFrame(frame);
  if (tween) {
    let k = Math.min(1, (now - tween.t0) / tween.dur); const e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    camera.position.lerpVectors(tween.from.p, tween.to.p, e); controls.target.lerpVectors(tween.from.t, tween.to.t, e);
    camera.fov = tween.from.fov + (tween.to.fov - tween.from.fov) * e; camera.lookAt(controls.target);
    if (k >= 1) { tween = null; controls.enabled = true; }
  }
  renderOnce();
  updateLabels();
}
function renderOnce() {
  controls.update();
  const dist = camera.position.distanceTo(controls.target);
  camera.near = dist > 80 ? dist - 45 : Math.max(.05, dist * .02); camera.far = Math.max(dist + 160, 800); camera.updateProjectionMatrix();
  if (composer) composer.render(); else renderer.render(scene, camera);
}
// render the current view (or a named one) off-screen at w x h pixels and return it as a PNG data URL
function snap(w, h, view) {
  const pr = renderer.getPixelRatio(), cur = document.querySelector('#bar button[data-v].on')?.dataset.v || sel.value;
  renderer.setPixelRatio(1); renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  if (composer) { composer.setPixelRatio(1); composer.setSize(w, h); }
  if (view) go(view, true);
  renderer.shadowMap.needsUpdate = true; renderOnce(); const url = canvas.toDataURL('image/png');
  renderer.setPixelRatio(pr); resize(); if (view && cur) go(cur, true);
  return url;
}
window.__snap = snap;
document.getElementById('png').addEventListener('click', () => {
  const k = Math.min(3, 3840 / Math.max(innerWidth, innerHeight)), a = document.createElement('a');
  a.href = snap(Math.round(innerWidth * k), Math.round(innerHeight * k)); a.download = 'kat-plani.png'; a.click();
});
const wh = document.getElementById('wh'); wh.value = String(Math.round(H * 100));
wh.addEventListener('change', () => { try { localStorage.setItem('wallH', wh.value); } catch (e) {} location.hash = 'h' + wh.value; location.reload(); });
msg.style.display = 'none';
requestAnimationFrame(frame);
</script>
